<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>REGEN MAP | 리젠솔루션</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=3b1fb0367cc1e192f0511e6051d7d800&amp;libraries=services,drawing,clusterer&amp;autoload=false"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
    :root {
      --ink:#1B2420; --ink-soft:#606B64; --ink-faint:#8A948D;
      --brand:#1F6E63; --brand-dark:#123F38; --brand-tint:#E3F0EE;
      --amber:#C6862E; --amber-tint:#FBF1E1;
      --danger:#C24B45; --danger-tint:#FBEEED;
      --bg:#F4F5F1; --card:#FFFFFF; --border:#E1E4DD; --border-soft:#EAEDE7;
      --shadow-sm: 0 1px 2px rgba(18,63,56,0.06);
      --shadow-md: 0 6px 20px rgba(18,63,56,0.08);
      --radius: 10px;
    }

    *{box-sizing:border-box;font-family:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;}
    .app{display:flex;height:100%;width:100%;}

    /* ===== Sidebar ===== */
    .sidebar{width:340px;min-width:340px;height:100%;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20;}
    .sidebarHeader{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--card);}
    .brandLogo{width:100%;height:auto;display:block;border-radius:8px;}
    .brand{font-weight:800;font-size:15px;letter-spacing:-0.2px;color:var(--ink);display:flex;align-items:center;gap:9px;}
    .brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(155deg, var(--brand) 0%, var(--brand-dark) 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;box-shadow:0 2px 6px rgba(18,63,56,0.35);}
    .brand .word{display:flex;flex-direction:column;line-height:1.15;}
    .brand .word b{font-size:14px;font-weight:800;}
    .brand .word span{font-size:10px;font-weight:600;color:var(--ink-faint);letter-spacing:0.2px;}
    .sidebarBody{flex:1;overflow-y:auto;padding:16px;scrollbar-width:thin;scrollbar-color:#c8cec6 transparent;}
    .sidebarBody::-webkit-scrollbar{width:6px;}
    .sidebarBody::-webkit-scrollbar-thumb{background:#c8cec6;border-radius:6px;}

    /* ===== Section cards ===== */
    .section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
    .sectionTitle{font-weight:800;font-size:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;position:relative;padding-left:11px;letter-spacing:0.1px;color:var(--ink);}
    .sectionTitle::before{content:"";position:absolute;left:0;top:1px;bottom:1px;width:3px;border-radius:3px;background:var(--brand);}
    .pill{font-size:10px;background:var(--brand);color:white;padding:3px 7px;border-radius:5px;font-weight:700;}

    .uploadBox{border:1.5px dashed #C7CFC8;border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;background:var(--bg);transition:border-color 0.15s, background 0.15s;}
    .uploadBox:hover, .uploadBox.dragover{border-color:var(--brand);background:var(--brand-tint);}

    .statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--border-soft);}
    .statItem{text-align:center;background:var(--card);border-radius:7px;padding:8px 4px;box-shadow:var(--shadow-sm);}
    .statLabel{font-size:11px;color:var(--ink-faint);margin-bottom:2px;font-weight:600;}
    .statValue{font-size:17px;font-weight:800;color:var(--ink);}

    .input-group { display: flex; gap: 6px; margin-bottom: 6px; }
    .input-box { flex: 1; padding: 9px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; background:var(--card); transition:border-color .15s, box-shadow .15s; }
    .input-box:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-tint); }

    .hr{ height:1px; background:var(--border-soft); margin:14px 0; border:none; }

    .btnRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
    .btn{width:100%;padding:10px;border-radius:8px;border:1px solid transparent;font-weight:700;cursor:pointer;font-size:12px;transition:filter .12s, background .12s, border-color .12s; text-align:center;}
    .btn.primary{background:var(--brand);color:white;}
    .btn.primary:hover{filter:brightness(1.08);}
    .btn.danger{background:var(--danger-tint);color:var(--danger);}
    .btn.danger:hover{filter:brightness(0.97);}
    .btn.outline{background:var(--card);border:1px solid var(--border);color:var(--ink);}
    .btn.outline:hover{background:var(--bg);}

    .mapArea{flex:1;position:relative;}
    #map{width:100%;height:100%;}

    .info-overlay {
      background: var(--card); border: 1.5px solid var(--brand-dark); border-radius: 8px;
      padding: 8px 12px; font-size: 13px; font-weight: 800; color: var(--ink);
      white-space: nowrap; box-shadow: var(--shadow-md); pointer-events: none;
      z-index: 99999 !important;
    }

    .modalBack{position:fixed;inset:0;background:rgba(18,24,20,0.45);z-index:9999;display:none;justify-content:center;align-items:center;}
    .modalPanel{width:90%;max-width:800px;background:var(--card);border-radius:14px;height:85vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,0.25);}
    .modalHeader{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;}
    .modalBody{flex:1;overflow-y:auto;padding:20px;}

    .result-list { list-style:none; padding:0; margin:0; }
    .result-item { padding:10px; border-bottom:1px solid var(--border-soft); cursor:pointer; transition:background .1s; border-radius:6px; }
    .result-item:hover { background: var(--brand-tint); }
    .result-item .place { font-weight:800; font-size:14px; color:var(--brand); }
    .result-item .addr { font-size:12px; color:var(--ink-faint); margin-top:2px; }

    .tabBar{display:flex;gap:8px;margin-bottom:15px;border-bottom:1px solid var(--border);padding-bottom:12px;flex-wrap:wrap;}
    .tabBtn{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;font-weight:700;color:var(--ink-soft);transition:.12s;}
    .tabBtn:hover{border-color:var(--brand);}
    .tabBtn.active{background:var(--brand-dark);color:white;border-color:var(--brand-dark);}
    .tabPane{display:none;}
    table.miniTable{width:100%;border-collapse:collapse;text-align:center;font-size:12px;}
    table.miniTable th{background:var(--bg);padding:7px 8px;position:sticky;top:0;z-index:10;font-weight:700;color:var(--ink-soft);}
    #statsModal table.miniTable th{position:static;top:auto;}
    #statsModal canvas{max-width:100%;max-height:100%;}
    table.miniTable td{padding:7px 8px;border-bottom:1px solid var(--border-soft);}

    #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--brand-dark);color:white;padding:9px 18px;border-radius:20px;font-size:12px;opacity:0;transition:0.3s;pointer-events:none;z-index:2000;box-shadow:var(--shadow-md);}
    #toast.show{opacity:1;bottom:50px;}

    #mapLegend{
      position:absolute;top:12px;left:12px;z-index:20;
      background:rgba(255,255,255,0.97);padding:10px 12px;border-radius:9px;
      box-shadow:var(--shadow-md);font-size:11px;border:1px solid var(--border-soft);
      display:flex;flex-direction:column;gap:6px;
    }
    .legend-item{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--ink-soft);}
    .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

    .info {
      position: relative; border-radius: 8px; border: 1px solid var(--border);
      font-size: 12px; padding: 6px 8px;
      background: var(--card); list-style: none; margin: 0;
      box-shadow: var(--shadow-md);
    }
    .info .label { display:inline-block; width:50px; color:var(--ink-faint); }
    .number { font-weight:bold; color:var(--brand); }

    .map-controls-container {
      position: absolute; top: 12px; right: 12px; z-index: 150;
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    }

    .map-type-group {
      display: flex; background: var(--card); border-radius: 8px;
      box-shadow: var(--shadow-md); overflow: hidden; border: 1px solid var(--border);
    }
    .map-type-btn {
      padding: 7px 12px; border: none; background: var(--card);
      font-size: 12px; font-weight: 700; color: var(--ink-soft); cursor: pointer;
      border-right: 1px solid var(--border-soft); transition: 0.1s;
    }
    .map-type-btn:last-child { border-right: none; }
    .map-type-btn:hover { background: var(--bg); }
    .map-type-btn.active { background: var(--brand); color: white; }

    .vertical-toolbar {
      width: 44px; background: var(--card); border-radius: 8px;
      box-shadow: var(--shadow-md); border: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .v-tool-btn {
      width: 44px; height: 44px; border: none; background: var(--card);
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      border-bottom: 1px solid var(--border-soft); color: var(--ink);
      transition: 0.1s;
    }
    .v-tool-btn:last-child { border-bottom: none; }
    .v-tool-btn span { font-size: 18px; }
    .v-tool-btn .lbl { font-size: 9px; font-weight: 700; line-height: 1; color: var(--ink-faint); }

    .v-tool-btn:hover { background: var(--bg); }
    .v-tool-btn.active { background: var(--brand-tint); color: var(--brand-dark); }
    .v-tool-btn.active .lbl { color: var(--brand-dark); }
    .v-tool-btn.danger { color: var(--danger); }
    .v-tool-btn.danger .lbl { color: var(--danger); }
    .v-divider { height: 1px; background: var(--border-soft); }

    #roadviewModal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80%; height: 70%; background: black; z-index: 2000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none;
      border-radius: 10px; overflow: hidden; border: 2px solid white;
    }
    #roadviewContainer { width: 100%; height: 100%; }
    .rv-close {
      position: absolute; top: 10px; right: 10px; z-index: 2001;
      background: var(--card); border: none; border-radius: 6px;
      padding: 6px 11px; font-weight: 700; cursor: pointer;
    }
</style>
</head>

function calcAgeFromRow(ageVal, rrnVal){
  // ageVal: 숫자/문자 혼합 나이(예: "69세6개월", "만 54세", "54") 또는 빈값
  // rrnVal: 주민번호(YYMMDD-XXXXXXX) 형태일 수 있음
  const pickYears = (v) => {
    if(v === null || v === undefined) return null;
    const s = String(v).trim();
    if(!s) return null;

    // 1) "69세6개월", "69세", "만 54세" 같은 케이스: '세' 앞 숫자만 사용
    const mSe = s.match(/(\d{1,3})\s*세/);
    if(mSe) return Number(mSe[1]);

    // 2) 숫자만 있는 케이스
    const mNum = s.match(/\d{1,3}/);
    if(mNum) return Number(mNum[0]);

    return null;
  };

  const a = pickYears(ageVal);
  if(a !== null && a >= 0 && a <= 120) return a;

  // 주민번호로 추정(가능한 경우)
  if(rrnVal){
    const s = String(rrnVal).replace(/\s/g,'');
    const m = s.match(/(\d{2})(\d{2})(\d{2})[-]?(\d)/);
    if(m){
      const yy = Number(m[1]), mm = Number(m[2]), dd = Number(m[3]);
      const g = Number(m[4]);
      if(mm>=1 && mm<=12 && dd>=1 && dd<=31){
        const now = new Date();
        const curYY = now.getFullYear();
        const century = (g===1||g===2||g===5||g===6) ? 1900 : (g===3||g===4||g===7||g===8) ? 2000 : 1900;
        const by = century + yy;
        let age = curYY - by;
        // 생일 미도래 보정(대략)
        const curMM = now.getMonth()+1, curDD = now.getDate();
        if(curMM < mm || (curMM===mm && curDD < dd)) age -= 1;
        if(age>=0 && age<=120) return age;
      }
    }
  }
  return null;
}

function getTimeHTML(distance) {
  var walkTime = distance / WALK_SPEED | 0;
  var walkHour = '', walkMin = '';
  if (walkTime > 60) walkHour = '<span class="number">' + Math.floor(walkTime / 60) + '</span>시간 ';
  walkMin = '<span class="number">' + walkTime % 60 + '</span>분';
  var bikeTime = distance / BIKE_SPEED | 0;
  var bikeHour = '', bikeMin = '';
  if (bikeTime > 60) bikeHour = '<span class="number">' + Math.floor(bikeTime / 60) + '</span>시간 ';
  bikeMin = '<span class="number">' + bikeTime % 60 + '</span>분';
  return '<ul class="info"><li><span class="label">총거리</span><span class="number">' + distance + '</span>m</li><li><span class="label">도보</span>' + walkHour + walkMin + '</li><li><span class="label">자전거</span>' + bikeHour + bikeMin + '</li></ul>';
}

    drawingManager = new kakao.maps.drawing.DrawingManager({
      map: map, drawingMode: [],
      circleOptions: { draggable: true, removable: true, strokeColor: '#1F6E63', fillColor: '#1F6E63', fillOpacity: 0.1 }
    });
    drawingManager.addListener('drawend', function(data) {

    roadviewClient = new kakao.maps.RoadviewClient();

}

async function processFile(file){
  toast("데이터 분석 중..."); const fr = new FileReader();
  fr.onload = (e) => {
    const data = new Uint8Array(e.target.result); let workbook; try { workbook = XLSX.read(data, {type:'array'}); } catch { const u = Encoding.convert(data, {to:"UNICODE", from:"AUTO"}); workbook = XLSX.read(Encoding.codeToString(u), {type:'string'}); }
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header:1}); parsePatients(rows);
  };
  fr.readAsArrayBuffer(file);
}

function parsePatients(rows){
  let headIdx = -1; for(let i=0; i<Math.min(rows.length, 20); i++){ if(JSON.stringify(rows[i]).includes("주소")) { headIdx = i; break; } }
  if(headIdx < 0) return toast("환자 데이터 형식이 아닙니다");
  const h = rows[headIdx].map(x => String(x||""));
  const idx = { id: h.findIndex(s => /차트|번호|ID/.test(s)), addr: h.findIndex(s => /주소/.test(s)), name: h.findIndex(s => /이름|성명|수진자|환자/.test(s)), new: h.findIndex(s => /신규|신환/.test(s)), type: h.findIndex(s => /구분|분류/.test(s)), age: h.findIndex(s => /나이|연령/.test(s)), rrn: h.findIndex(s => /주민|주민번호/.test(s)) };
  const mapData = new Map(); let totalV = 0; let newIds = [];
  for(let i=headIdx+1; i<rows.length; i++){
    const r = rows[i]; if(!r || !r[idx.id]) continue; const pid = String(r[idx.id]); totalV++;
    const numId = parseInt(pid.replace(/[^0-9]/g, "")) || 0;
    if(!mapData.has(pid)) { mapData.set(pid, { id: pid, numId: numId, name: r[idx.name]||"미상", addr: r[idx.addr]||"", age: null, visits: [] }); }
    const p = mapData.get(pid);
    if(p.age === null){ p.age = calcAgeFromRow(idx.age >= 0 ? r[idx.age] : null, idx.rrn >= 0 ? r[idx.rrn] : null); }
    let isNewVisit = false;
    // [의사랑 규칙]
// 보험구분/급여구분 값은 신환/재진 판정에 사용하지 않음

    if(idx.new >= 0 && r[idx.new]) isNewVisit = true;
    else if(idx.type >= 0) { const t = String(r[idx.type]||""); if(!t.includes("90") && /신환|신규/.test(t)) isNewVisit = true; }
    const bit = (idx.type >= 0) ? String(r[idx.type]||"") : "";
    p.visits.push({ isNew: isNewVisit, bit: bit }); if(isNewVisit) newIds.push(numId);
  }
  newIds.sort((a,b)=>a-b); let threshold = newIds.length > 5 ? newIds[Math.floor(newIds.length*0.2)] : 0;
  patients = Array.from(mapData.values());

  // ===============================
  // ❌ 엑셀 헤더 행 제거 (차트번호 / 수진자명)
  // ===============================
  patients = patients.filter(p =>
    p.id !== "차트번호" && p.name !== "수진자명"
  );

  patients.forEach(p => {
    p.total = p.visits.length;
  });
  $('statTotalUsers').innerText = patients.length.toLocaleString();
  $('statTotalVisits').innerText = totalV.toLocaleString();
  clusterer.clear();
  patients.forEach((p, i) => {
    setTimeout(() => {
      geocoder.addressSearch(p.addr, (res, status) => {
        if(status === kakao.maps.services.Status.OK){
          const latlng = new kakao.maps.LatLng(res[0].y, res[0].x); p.latlng = latlng;
          p.dong = res[0].address?.region_3depth_name || "미상";
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><circle cx="7" cy="7" r="6" fill="${PATIENT_COLOR}" stroke="white" stroke-width="1"/></svg>`;
          p.marker = new kakao.maps.Marker({ position: latlng, image: new kakao.maps.MarkerImage("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg), new kakao.maps.Size(14,14)) });
          const iw = new kakao.maps.InfoWindow({ content: `<div style="padding:5px;font-size:12px;"><b>${p.id} ${p.name}</b><br>내원 ${p.total}회</div>`, removable: true });
          kakao.maps.event.addListener(p.marker, 'click', () => iw.open(map, p.marker));
          clusterer.addMarker(p.marker);
        }
        if(i === patients.length - 1) { applyFilter(); $('btnFit').click(); toast("로딩 완료"); }
      });
    }, i * 30);
  });
}

function bucketAge(age){
  if(age === null || age === undefined || !Number.isFinite(Number(age))) return "미상";
  const a = Number(age);
  if(a <= 19) return "0~19";
  if(a <= 29) return "20~29";
  if(a <= 39) return "30~39";
  if(a <= 49) return "40~49";
  if(a <= 59) return "50~59";
  if(a <= 69) return "60~69";
  return "70+";
}

function buildVisiblePatients(){

    }
    return true;
  });
}

/** ===== 추가 상세 통계 유틸/렌더러 ===== */
function buildTopRowsWithOther(rows, topN){
  const top = rows.slice(0, topN);
  const rest = rows.slice(topN);
  if(!rest.length) return { rows: top, hasOther:false };
  const other = rest.reduce((acc,r)=>{
    acc.n += r.n; acc.conv += r.conv; acc.d90 += r.d90; acc.ret += r.ret; acc.total += r.total; acc.sumVisits += (r.sumVisits||0);
    return acc;
  }, { dong:"기타", n:0, conv:0, d90:0, ret:0, total:0, sumVisits:0 });
  return { rows: top.concat([other]), hasOther:true };
}

function renderDongTab(dongRows){

  const tbl = document.getElementById('tblDong');

  const canvas = document.getElementById('chartDong');

  const excludeUnknown = getExcludeUnknownDong();
  const topN = getDongTopN();

  let base = excludeUnknown ? dongRows.filter(r => r.dong !== '미상') : dongRows.slice();
  base = base.map(r => ({...r, sumVisits: safeNum(r.sumVisits)}));
  base.sort((a,b)=> safeNum(b.total) - safeNum(a.total));

  let showRows = base;
  if(topN !== Infinity){

  }

  const totalAll = base.reduce((s,r)=>s+safeNum(r.total),0) || 1;
  const fmt = (n)=> Number(n||0).toLocaleString();
  tbl.innerHTML = showRows.map(r=>{

    return `<tr style="${style}">

      <td><b>${fmt(r.total)}</b></td>
      <td>${pct(r.total, totalAll)}%</td>

function getActiveStatsTabId(){
  const panes = Array.from(document.querySelectorAll('.tabPane'));
  const shown = panes.find(p => (p.style && p.style.display === 'block'));
  return shown ? shown.id : 'tabType';
}


function maybeRenderExtraStats(tabId){
  const dongRows = window.__lastStatsDongRows || [];
  const visible = window.__lastStatsVisible || [];

  if(tabId === 'tabDong'){
    if(dongRows.length) renderDongTab(dongRows);
  } else if(tabId === 'tabAge'){
    renderAgeDistribution(visible);
  } else if(tabId === 'tabRadius'){
    renderDistanceCharts(visible);
  }
}

function maybeRenderExtraStatsForActiveTab(){
  const tabId = getActiveStatsTabId();
  maybeRenderExtraStats(tabId);
}

function resizeAllStatCharts(){
  const list = [ chartObjDong, chartObjAge, chartObjDistHist ];
  list.forEach(ch => { try { ch && ch.resize(); } catch(e){} });
}

// 탭 클릭 후 숨김->표시 전환 시 차트 리사이즈
document.addEventListener('click', (e) => {
  const t = e.target;
  if(t && t.classList && t.classList.contains('tabBtn')){
    setTimeout(() => resizeAllStatCharts(), 80);

  }
});

// 거리/반경 옵션 변경 시 즉시 재렌더
(() => {
  const sel = document.getElementById('distMinN');
  if(sel){
    sel.addEventListener('change', () => {
      try{
        if(getActiveStatsTabId() === 'tabRadius'){
          maybeRenderExtraStats('tabRadius');
          setTimeout(() => resizeAllStatCharts(), 50);
        }
      }catch(e){}
    });
  }
})();


$('btnClear').onclick = () => { clusterer.clear(); patients=[]; $('statTotalUsers').innerText=0; $('statTotalVisits').innerText=0; toast("초기화"); };
window.switchTab = (id) => {
  document.querySelectorAll('.tabPane').forEach(e => e.style.display='none');
  const pane = document.getElementById(id);
  if(pane) pane.style.display='block';
  document.querySelectorAll('.tabBtn').forEach(b => b.classList.remove('active'));
  const ev = window.event;
  if(ev && ev.target) ev.target.classList.add('active');

  // ✅ 새 탭: 표시된 뒤 렌더
  try { maybeRenderExtraStats(id); } catch(e){ console.error(e); }
  setTimeout(() => resizeAllStatCharts(), 80);
};


</script>
